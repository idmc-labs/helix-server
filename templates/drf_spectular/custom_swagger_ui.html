{% extends "drf_spectacular/swagger_ui.html" %}

{% block head %}
  {{ block.super }}
  <style>
    @import url("https://use.typekit.net/ret0ejy.css");

    html, body {
        position: relative;
        margin: 0;
        padding: 0;
        font-family: 'proxima-nova', sans-serif;
        background-color: #ffffff,
    }

    .information-container h1,
    .information-container h2,
    .information-container h3,
    .information-container h4,
    .information-container h5,
    .information-container h6 {
        font-family: 'freight-big-pro', sans-serif !important;
        color: #193256;
    }

    a {
        color: #018eca;
        text-decoration: none;
    }

    * {
        box-sizing: border-box;
    }

    div[data-name=modelPanel] > .model-box {
        width: 100%;
    }

    .model-title__text {
        font-size: 12px;
    }
  </style>
{% endblock %}

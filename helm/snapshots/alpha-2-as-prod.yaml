# Hook files ConfigMap for: create-users
apiVersion: v1
kind: ConfigMap
metadata:
  name: helix-backend-1-create-users-files
  annotations:
    argocd.argoproj.io/hook: "PostSync"
    argocd.argoproj.io/sync-wave: "25"
    # Refresh content on every sync and clean up before the next run.
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
  labels:
    app: helix-backend-1
    component: hook
    hookName: create-users
    environment: ALPHA-1
    release: release-name
data:
  create_users.py: "import os\nimport re\nfrom apps.users.models import User\nfrom apps.users.enums import USER_ROLE\nfrom apps.users.models import Portfolio\n\nfrom django.db import transaction\nfrom django.core.management import call_command\n\ncall_command(\"wait_for_resources\", \"--cache\", \"--db\")\n\nset_as_admin_user_emails = [\n  email.strip(\" \")\n  for email in re.split(r\"[,\\s]+\", os.environ[\"SET_AS_ADMIN_USER_EMAILS\"])\n  if email is not None and email.strip(\" \") != \"\"\n]\n\n@transaction.atomic\ndef create_initial_users():\n  for email in set_as_admin_user_emails:\n      user = User.objects.filter(email=email).first()\n      if user is None:\n          print(f\"Failed to process user {email=}. Doesn't exists\")\n\n      user.username = user.email = email\n      user.is_superuser = True\n      user.is_staff = True\n      user.is_active = True\n      user.save()\n      print(f\"Successfully updated user {email=} as superuser\")\n\n      role = USER_ROLE.ADMIN\n      Portfolio.objects.get_or_create(\n          user=user,\n          role=role,\n      )\n      print(f\"\\tSuccessfully updated user portfolio {role=}\")\n\ncreate_initial_users()\n"

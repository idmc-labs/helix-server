app:
  environment: ALPHA-1
  fullnameOverride: helix-backend-1

  image:
    name: local.git.com/idmc/helix-backend
    tag: develop.xxxxxxxx

  api:
    ingress:
      host: helix-api-1.idmc.local.example.com

  env:
    # App Domain
    APP_DOMAIN: "helix-api-1.idmc.local.example.com"
    DJANGO_ALLOWED_HOST: "helix-1.idmc.local.example.com,helix-api-1.idmc.local.example.com"
    BACKEND_BASE_URL: "https://helix-api-1.idmc.local.example.com"
    FRONTEND_BASE_URL: "https://helix-1.idmc.local.example.com"
    ADDITIONAL_TRUSTED_ORIGINS: "https://preview-idmc-website-components-1.idmc.local.example.com,https://release-idmc-website-components-1.idmc.local.example.com"
    # App Domain
    SESSION_COOKIE_DOMAIN: ".example.com"
    CSRF_COOKIE_DOMAIN: ".example.com"

  secrets:
    DJANGO_SECRET_KEY: xyz
    # Postgres (external)
    POSTGRES_HOST: helix-backend-1-pg
    POSTGRES_PORT: "5432"
    POSTGRES_DB: helix
    POSTGRES_USER: helix
    POSTGRES_PASSWORD: "XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX"
    # Minio (S3, external)
    AWS_S3_ENDPOINT_URL: https://helix-minio-1.idmc.local.example.com/
    AWS_S3_ACCESS_KEY_ID: helix
    AWS_S3_SECRET_ACCESS_KEY: XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
    SENTRY_DSN: https://xyz@sentry.local.example.com/14
    HCAPTCHA_SECRET: "xyz"

  hooks:
    enabled: true
    jobs:
      # NOTE: Make sure keys are lowercase
      create-users:
        enabled: true
        annotations:
          argocd.argoproj.io/hook: "PostSync"
          argocd.argoproj.io/sync-wave: "25"
          argocd.argoproj.io/hook-delete-policy: "BeforeHookCreation"
        extraEnv:
          SET_AS_ADMIN_USER_EMAILS: "xyz@example.com,abc@example.com"

  extraManifests:
    dragonflydb-cluster:
      spec:
        snapshot:
          persistentVolumeClaimSpec:
            storageClassName: local-path

app:
  # extraEnvVars as a DICT (name: {value|valueFrom})
  # Checkout the resources defined by extraManifests
  extraEnvVars:
    CELERY_BROKER_URL: { value: redis://idmc-helix-dragonfly:6379/0 }
    CELERY_RESULT_BACKEND_URL: { value: redis://idmc-helix-dragonfly:6379/1 }
    DJANGO_CACHE_REDIS_URL: { value: redis://idmc-helix-dragonfly:6379/2 }
    DJANGO_EXTERNAL_API_CACHE_REDIS_URL: { value: redis://idmc-helix-dragonfly:6379/3 }

  extraManifests:
    dragonflydb-cluster:
      apiVersion: dragonflydb.io/v1alpha1
      kind: Dragonfly
      metadata:
        labels:
          app.kubernetes.io/name: dragonfly
        name: idmc-helix-dragonfly  # NOTE: this will be the service name
      spec:
        replicas: 1
        args: ["--dbfilename=mainSnapshot"]  # NOTE: Only maintains 1 last snapshot
        resources:
          requests:
            cpu: "0.1"
            memory: 500Mi
          limits:
            cpu: "1"
            memory: 750Mi
        snapshot:
          cron: "*/5 * * * *"
          persistentVolumeClaimSpec:
            # storageClassName:
            accessModes:
            - ReadWriteOnce
            resources:
              requests:
                storage: 0.5Gi

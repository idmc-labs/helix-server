app:
  environment: PROD
  # Global Image
  image:
    name: SET-BY-CICD-IMAGE
    tag: SET-BY-CICD-TAG
    imagePullPolicy: IfNotPresent

  api:
    enabled: true
    containerPort: 80
    command: ["/code/deploy/scripts/run_prod.sh"]
    ingress:
      enabled: true
      className:
      host:
    resources:
      requests:
        cpu: "2"
        memory: 0.5Gi
      limits:
        cpu: "2"
        memory: 1Gi

  worker:
    enabled: true
    queueDefaults:
      commandPrefix:
        - "celery"
        - "-A"
        - "helix"
        - "worker"
        - "-l"
        - "INFO"
    addons:
      beat:
        enabled: true
        replicaCount: 1
        command: ["celery", "-A", "helix", "beat", "-l", "INFO"]
        resources:
          requests:
            cpu: "1"
            memory: 0.5Gi
          limits:
            cpu: "1"
            memory: 1Gi
      flower:
        enabled: false  # Install flower package first
        command: ["celery", "-A", "main", "flower", "--port=8000"]
        service:
          enabled: true
          port: 80
          targetPort: 8000
        resources:
          requests:
            cpu: "0.1"
            memory: 0.5Gi
          limits:
            cpu: "1"
            memory: 1Gi
    queues:
      # NOTE: Make sure keys are lowercase
      default:
        enabled: true
        celeryArgs:
          - "-Q"
          - "celery"
          - "--concurrency"
          - "4"
          - "--max-tasks-per-child"
          - "10"
        resources:
          requests:
            cpu: "1"
            memory: 1Gi
          limits:
            cpu: "1"
            memory: 2Gi

  hooks:
    enabled: true
    defaults:
      resources:
        requests:
          cpu: "0.1"
          memory: 1Gi
        limits:
          cpu: "4"
          memory: 2Gi
    jobs:
      # NOTE: Make sure keys are lowercase.
      # db-migrate and collect-static inherit the chart defaults verbatim
      # (Sync hook @ wave 20, `manage.py migrate` / `collectstatic --noinput`).
      # wait-for-resources (Sync hook @ wave 10) gates api/worker on connectivity.
      wait-for-resources:
        command: ["./manage.py", "wait_for_resources", "--db", "--cache", "--minio"]

  # NOTE: Check main/settings.py for all available options
  env:
    APP_RELEASE: "{{ $.Values.image.tag }}"
    HELIX_ENVIRONMENT: "{{ $.Values.environment }}"
    DJANGO_DEBUG: "false"
    # AWS
    USE_S3_BUCKET: "true"
    S3_BUCKET_NAME: "helix-data"
    EXTERNAL_S3_BUCKET_NAME: "helix-external-data"
    # Sentry
    SENTRY_MONITOR_CELERY_BEAT_TASKS: "true"
    SENTRY_SAMPLE_RATE: "0.2"
    SENTRY_PROFILES_SAMPLE_RATE: "0.2"

  # NOTE: Check main/settings.py for all available options
  # Postgres and Minio (S3) are external services (provisioned outside this chart,
  # e.g. via banjo-alpha-deps). Their hostnames/endpoints and credentials, along with
  # the required app domain/URL env and DJANGO_SECRET_KEY, are supplied by deploys via
  # env/secrets values (see values/alpha.yaml). Redis is provided via the Dragonfly
  # extraManifest defined in values/operators.yaml.

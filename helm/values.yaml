app:
  environment: PROD
  # Global Image
  image:
    name: SET-BY-CICD-IMAGE
    tag: SET-BY-CICD-TAG
    imagePullPolicy: IfNotPresent

  ingress:
    enabled: true
    className:
    host:

  redis:
    enabled: false
    fullnameOverride: "idmc-pg"

  minio:
    enabled: false
    disableWebUI: true
    mode: standalone
    fullnameOverride: helix-minio
    global:
      defaultStorageClass:
    apiIngress:
      enabled: true
      ingressClassName:
      hostname:
      annotations:
        nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    auth:
      forceNewKeys: True
      rootUser: helix
      rootPassword:
    persistence:
      enabled: true
      size: 1Gi
    defaultBuckets: helix-data,helix-external-data  # XXX: Don't change this
    provisioning:
      enabled: true
      resourcesPreset: "nano"
      cleanupAfterFinished:
        enabled: true
      extraCommands:
        - "mc anonymous set download provisioning/helix-data"
        - "mc anonymous set download provisioning/helix-external-data"

  api:
    enabled: true
    replicaCount: 1
    containerPort: 80
    command: ["/code/deploy/scripts/run_prod.sh"]
    resources:
      requests:
        cpu: "2"
        memory: 0.5Gi
      limits:
        cpu: "2"
        memory: 1Gi

  worker:
    enabled: true
    beat:
      enabled: true
      command: ["celery", "-A", "helix", "beat", "-l", "INFO"]
      resources:
        requests:
          cpu: "1"
          memory: 0.5Gi
        limits:
          cpu: "1"
          memory: 1Gi
    flower:
      enabled: false  # Install flower package first
      command: ["celery", "-A", "main", "flower", "--port=8000"]
      resources:
        requests:
          cpu: "0.1"
          memory: 0.5Gi
        limits:
          cpu: "1"
          memory: 1Gi
    queueCommandPrefix:
      - "celery"
      - "-A"
      - "helix"
      - "worker"
      - "-l"
      - "INFO"
    queues:
      # NOTE: Make sure keys are lowercase
      default:
        enabled: true
        replicaCount: 1
        celeryArgs:
          - "-Q"
          - "celery"
          - "--concurrency"
          - "4"
          - "--max-tasks-per-child"
          - "10"
        resources:
          requests:
            cpu: "1"
            memory: 1Gi
          limits:
            cpu: "1"
            memory: 2Gi

  argoHook:
    enabled: true
    resources:
      requests:
        cpu: "0.1"
        memory: 1Gi
      limits:
        cpu: "4"
        memory: 2Gi
    hooks:
      # NOTE: Make sure keys are lowercase
      db-migrate:
        enabled: true
        hook: PostSync
        preserveHistory: true
        command: ["/bin/bash", "-c"]
        args:
          - "./manage.py wait_for_resources --db && ./manage.py migrate"
      collect-static:
        enabled: true
        hook: PostSync
        command: ["/bin/bash", "-c"]
        args:
          - "./manage.py wait_for_resources --minio && ./manage.py collectstatic --noinput"

  # NOTE: Check main/settings.py for all available options
  env:
    # AWS
    USE_S3_BUCKET: "true"
    AWS_S3_AWS_ENDPOINT_URL: "https://{{ $.Values.minio.apiIngress.hostname }}/"
    S3_BUCKET_NAME: "helix-data"
    EXTERNAL_S3_BUCKET_NAME: "helix-external-data"
  # NOTE: Check main/settings.py for all available options
  secrets:
    DJANGO_SECRET_KEY: "{{ required \".app.secrets.DJANGO_SECRET_KEY\" nil }}"
    # Redis
    CELERY_BROKER_URL: "redis://{{ printf \"%s-master\" (include \"common.names.fullname\" $.Subcharts.redis) }}:6379/0"
    DJANGO_CACHE_REDIS_URL: "redis://{{ printf \"%s-master\" (include \"common.names.fullname\" $.Subcharts.redis) }}:6379/1"
    CELERY_RESULT_BACKEND_URL: "redis://{{ printf \"%s-master\" (include \"common.names.fullname\" $.Subcharts.redis) }}:6379/2"
    DJANGO_EXTERNAL_API_CACHE_REDIS_URL: "redis://{{ printf \"%s-master\" (include \"common.names.fullname\" $.Subcharts.redis) }}:6379/3"
    # Minio (S3)
    AWS_S3_ACCESS_KEY_ID: "{{ required \".app.minio.auth.rootUser\" $.Values.minio.auth.rootUser }}"
    AWS_S3_SECRET_ACCESS_KEY: "{{ required \".app.minio.auth.rootPassword\" $.Values.minio.auth.rootPassword }}"
    AWS_S3_REGION: "us-east-1"
    # Misc
    SENTRY_DSN: "{{ required \".app.secrets.SENTRY_DSN\" nil }}"
    HCAPTCHA_SECRET: "{{ required \".app.secrets.HCAPTCHA_SECRET\" nil }}"

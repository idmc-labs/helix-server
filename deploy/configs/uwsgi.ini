[uwsgi]

chdir = /code/
module = helix.wsgi

master = true
processes = 10
http = 0.0.0.0:80
chmod = 666

vacuum = true
harakiri = 60

# Keep kubelet health-probe requests (banjo-utils HealthProbeMiddleware serves
# /healthz/live|ready/) out of the access log; they hit every few seconds and
# drown out real traffic. Needs uWSGI built with PCRE (see Dockerfile:
# libpcre3-dev) — the route is silently ignored otherwise.
route = ^/healthz/(live|ready)/?$ donotlog:

# req-logger = file:/var/log/uwsgi/request.log,
# logger = file:/var/log/uwsgi/error.log,maxsize=10240

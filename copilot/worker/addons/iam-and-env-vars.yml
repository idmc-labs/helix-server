Parameters:
  App:
    Type: String
    Description: Your application's name.
  Env:
    Type: String
    Description: The environment name your service, job, or workflow is being deployed to.
  Name:
    Type: String
    Description: The name of the service, job, or workflow being deployed.
  DBClusterName:
    Type: String
    Description: The prefix of the db cluster name deployed with django server.
    Default: helixdbcluster

Resources:
  # https://aws.github.io/copilot-cli/docs/developing/additional-aws-resources/
  ResourceAccessPolicy:
    Metadata:
      'aws:copilot:description': 'This is for the worker service to access the addons created for django service'
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: 'Grants secret manager access; Grants CRUD access to S3 bucket; Grants read-only access to the cross-account idmc-playground-nlp-storage bucket'
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Sid: SMActions
            Effect: Allow
            Action:
              - secretsmanager:GetResourcePolicy
              - secretsmanager:GetSecretValue
              - secretsmanager:DescribeSecret
              - secretsmanager:ListSecretVersionIds,
              - secretsmanager:ListSecrets
            # NOTE: tried with 'arn:aws:secretsmanager:::secret:*' followed by condition, did not work
            Resource:
              !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${DBClusterName}*'
          - Sid: S3ObjectActions
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
              - s3:PutObjectACL
              - s3:PutObjectTagging
              - s3:DeleteObject
              - s3:RestoreObject
            Resource:
              - !Sub
                - arn:aws:s3:::${BucketArn}/*
                - { BucketArn: { 'Fn::ImportValue': !Sub '${App}-${Env}-S3MediaBucketName' }}
              - !Sub
                - arn:aws:s3:::${BucketArn}/*
                - { BucketArn: { 'Fn::ImportValue': !Sub '${App}-${Env}-ExternalS3MediaBucketName' }}
          - Sid: S3ListAction
            Effect: Allow
            Action: s3:ListBucket
            Resource:
              - !Sub
                - arn:aws:s3:::${BucketArn}
                - { BucketArn: { 'Fn::ImportValue': !Sub '${App}-${Env}-S3MediaBucketName' }}
              - !Sub
                - arn:aws:s3:::${BucketArn}
                - { BucketArn: { 'Fn::ImportValue': !Sub '${App}-${Env}-ExternalS3MediaBucketName' }}
          # NOTE: Cross-account bucket owned by the NLP Playground.
          # Hulk bulk-import copies objects from here into the media bucket, so the task role needs read-only access to it.
          # The matching grant on the bucket side lives in that account applied throw terraform
          - Sid: PlaygroundNlpObjectRead
            Effect: Allow
            Action:
              # GetObject covers both the HEAD that resolves the key and the copy's source read;
              # GetObjectTagging is required because copy_object leaves TaggingDirective at its COPY default.
              - s3:GetObject
              - s3:GetObjectTagging
            Resource: 'arn:aws:s3:::idmc-playground-nlp-storage/*'
          - Sid: PlaygroundNlpBucketRead
            Effect: Allow
            # ListBucket makes a HEAD on a missing key answer 404 rather than 403, so the resolver's log distinguishes a wrong key from a revoked grant.
            Action: s3:ListBucket
            Resource: 'arn:aws:s3:::idmc-playground-nlp-storage'
          - Sid: EmailSenderAction
            Effect: Allow
            Action:
              - ses:GetSendQuota
              - ses:SendEmail
              - ses:SendRawEmail
            Resource: '*'
            # NOTE: below did not work, though it is specific
            # Resource: !Sub 'arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/idmcdb.org'
          - Sid: DatabaseAccessActions
            Effect: Allow
            Action:
              - secretsmanager:GetResourcePolicy
              - secretsmanager:GetSecretValue
              - secretsmanager:DescribeSecret
              - secretsmanager:ListSecretVersionIds,
              - secretsmanager:ListSecrets
            Resource:
              - Fn::ImportValue: !Sub '${App}-${Env}-DatabaseSecret'

Outputs:
  # We also need to output the IAM ManagedPolicy so that Copilot can inject it to our ECS task role.
  WorkerIAMPolicy:
    Description: "The ManagedPolicy to attach to the task role."
    Value: !Ref ResourceAccessPolicy

  # NOTE: this bucket name env-var is uniform across stack: S3_BUCKET_NAME
  S3BucketName:
    Description: "The name of a user-defined bucket."
    Value:
      Fn::ImportValue:
        !Sub ${App}-${Env}-S3MediaBucketName

  # NOTE: this bucket name env-var is uniform across stack: EXTERNAL_S3_BUCKET_NAME
  ExternalS3BucketName:
    Description: "The name of a user-defined bucket."
    Value:
      Fn::ImportValue:
        !Sub ${App}-${Env}-ExternalS3MediaBucketName

  # From aip/addons/helix-db-cluster.yml (This will inject HELIXDBCLUSTER_SECRET_ARN)
  helixdbclusterSecretArn:
    Value:
      Fn::ImportValue:
        !Sub ${App}-${Env}-DatabaseSecret

  ElastiCacheAddress: # env var ELASTI_CACHE_ADDRESS
    Description: ElastiCache endpoint address
    Value:
      Fn::ImportValue:
        !Sub ${App}-${Env}-ElastiCacheAddress

  ElastiCachePort: # env var ELASTI_CACHE_PORT
    Description: ElastiCache port
    Value:
      Fn::ImportValue:
        !Sub ${App}-${Env}-ElastiCachePort

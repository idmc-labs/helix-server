[project]
name = "helix-server"
version = "2025.12.31-dev1"  # managed by release.sh
description = "Helix Server"
authors = [
  {name = "Dev", email = "ch.datainfo+dev@idmc.ch"},
]
readme = "README.md"
requires-python = "~=3.8.0"

dependencies = [
    "Django==3.2",
    "bleach==3.3.0",
    "boto3==1.34.19",
    "celery~=5.3",
    "colorlog",
    "django-admin-autocomplete-filter",
    "django-cors-headers==4.3.1",
    "django-debug-toolbar==2.2",
    "django-enumfield==3.1",
    "django-environ",
    "django-extensions==3.0.4",
    "django-filter==2.4.0",
    "django-graphiql-debug-toolbar==0.1.4",
    "django-health-check",
    "django-otp[qrcode]==1.0.6",
    "django-redis>=5.3.0,<6",
    "django-rest-framework==0.1.0",
    "django-ses==2.0.0",
    "django-storages==1.11.1",
    "djoser==2.0.3",
    "drf-spectacular[sidecar]>=0.26.5",
    "factory-boy==3.0.1",
    "filemagic==1.6",
    "graphene-django-extras==0.4.9",
    "graphene-django==2.13.0",
    "graphene-file-upload==1.2.2",
    "graphene-graphiql-explorer==0.0.1",
    "ipython",
    "json5>=0.14.0",
    "lxml==4.6.3",
    "openpyxl==3.0.6",
    "pdfkit==0.6.1",
    "psycopg2==2.8",
    "requests",
    "selenium==3.141.0",
    "sentry-sdk",
    "shapely==2.0.1",
    "snapshottest>=0.6.0",
    "turfpy==0.0.6",
    "uWSGI==2.0.31",
]

[dependency-groups]
dev = [
    "pytest-django==3.9.0",
    "pytest-sugar==0.9.7",
    "django-stubs",
]

[tool.pyright]
extraPaths = ["apps"]
exclude = [
    "**/node_modules",
    "**/__pycache__",
    "apps/experimental",
    "apps/typestubs"
]
reportMissingImports = true
reportMissingTypeStubs = false

[tool.ruff]
line-length = 125
extend-exclude = [
    ".git",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
    ".venv",
    "venv",
    "**/migrations/*",
    "__pycache__",
]

[tool.ruff.lint]
flake8-builtins.builtins-strict-checking = false
ignore = [
    "C901",
    "E701",
    "E203",
]
extend-select = ["I", "E", "F"]
# TODO: Use this instead `select = ["ALL"]` and add rules to ignore
#   ruff check --statistics ./

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402"]
